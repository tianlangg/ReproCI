name: CI
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check src tests demo scripts
      - run: uv run ruff check src tests demo scripts
      - run: uv run pytest tests/unit
      - run: uv run python demo/create_history.py demo/history
      - run: docker build -t reproci-demo-test:ci demo
      - run: REPROCI_PORT=18743 REPROCI_GITHUB_SECRET=ci-secret docker compose up --build -d
      - run: uv run pytest tests/integration -v
        env:
          REPROCI_API_URL: http://127.0.0.1:18743
      - if: always()
        run: docker compose down
