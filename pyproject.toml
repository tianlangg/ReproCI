[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproci"
version = "0.1.0"
description = "A small, inspectable container CI and debugging engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6", "alembic==1.15.2", "docker==7.1.0",
  "httpx==0.28.1", "pydantic-settings==2.8.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.5", "testcontainers[postgres]==4.10.0"]

[project.scripts]
reproci = "reproci.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reproci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

